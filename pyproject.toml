[project]
name = "edgelab"
version = "0.1.0"
description = "Plateforme de recherche quantitative : tuer les idées avant qu'elles ne tuent un compte."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.scripts]
edgelab = "edgelab.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgelab"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["edgelab", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",                # pyupgrade
    "B",                # bugbear
    "C4",                # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ANN",              # type annotations
    "PL",                # pylint subset
    "PTH",              # prefer pathlib
    "LOG", "G",          # logging
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PL"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^web/"]

[tool.pytest.ini_options]
addopts = "--cov=edgelab --cov-report=term-missing --cov-branch"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
